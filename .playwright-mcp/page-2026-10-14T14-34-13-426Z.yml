        - heading "Building with AI since 2019." [level=2] [ref=f4e114]
        - paragraph [ref=f4e115]: Nick was early to spot the business utility of generative AI. In 2019, well before ChatGPT, he started building with early image and language models to create one of the largest content agencies in Canada.
      - generic [ref=f4e116]:
        - article [ref=f4e117]:
          - img "Portrait of Nick Saraev" [ref=f4e119]
          - heading "Nick Saraev" [level=3] [ref=f4e121]
          - paragraph [ref=f4e122]: CEO / Talent
          - paragraph [ref=f4e123]:
            - text: Nick runs a 400K-subscriber YouTube channel and
            - link "Maker School" [ref=f4e124] [cursor=pointer]:
