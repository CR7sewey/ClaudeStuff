            - text: ", the #1 AI community on Skool ($250K/mo, 10,000+ graduates). He has generated over $10M in revenue for clients across 20+ industries using proprietary AI systems."
          - paragraph [ref=f4e125]: His public track record and exposure to top-tier talent lets him source exceptional, senior-level development in days, not months.
        - article [ref=f4e126]:
          - img "Portrait of Cody McLean" [ref=f4e128]
          - heading "Cody McLean" [level=3] [ref=f4e130]
          - paragraph [ref=f4e131]: Head of AI Solutions
          - paragraph [ref=f4e132]: Cody spent 8 years leading Hill&Foster, designing and shipping software for 200+ clients, including the Government of California, Lululemon, and QubeIoT. His work is relied on by millions daily.
          - paragraph [ref=f4e133]: At LeftClick, he applies that full-stack expertise to architecting AI-driven automations, intelligent workflows, and end-to-end systems that cut overhead and accelerate growth for every client we take on.
        - article [ref=f4e134]:
          - img "Portrait of George Dinu" [ref=f4e136]
          - heading "George Dinu" [level=3] [ref=f4e138]
          - paragraph [ref=f4e139]: Head of Delivery
          - paragraph [ref=f4e140]: George owns the end-to-end technical execution of every client engagement. He architects backend systems, automation pipelines, and AI infrastructure, turning strategic roadmaps into production-grade solutions that run reliably at scale.
          - paragraph [ref=f4e141]: With deep expertise across cloud architecture, data engineering, and systems integration, George ensures that what we promise in the boardroom actually ships. Tested, documented, and built to last.
